[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observatory-pair"
version = "0.4.0"
description = "Exploratory manual inspection of two A-share price series"
requires-python = ">=3.11"
dependencies = ["akshare==1.17.87", "matplotlib>=3.8,<4", "numpy>=1.26,<3", "pandas>=2.1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
observatory-pair = "observatory.cli:main"

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
